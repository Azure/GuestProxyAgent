name: CI Build & Test

on:
  push:
    branches: ["main", "dev"]
  pull_request:
    branches: ["main", "dev"]

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: cicd-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  linux_lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install eBPF build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbpf-dev libbpfcc-dev clang llvm
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt clippy
      - run: cargo fmt --all -- --check -l
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: cargo-audit
        run: | 
          cargo install cargo-audit --locked
          cargo-audit audit

  win_lint:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: dtolnay/rust-toolchain@a5f673d0ba8626c3977bb416a1612774bc82181b # 1.95.0
        with:
          components: rustfmt clippy
      - run: cargo fmt --all -- --check -l
      - name: Clippy
        run: cargo clippy -- -D warnings
      - name: cargo-audit
        run: | 
          cargo install cargo-audit --locked
          cargo-audit audit

  build:
    uses: ./.github/workflows/reusable-build.yml
    with:
      generate_release: false
